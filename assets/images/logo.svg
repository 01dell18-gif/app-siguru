<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a0ca3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4895ef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <rect width="180" height="180" x="10" y="10" rx="40" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Inner circular ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="6 4" />
  
  <!-- Graduation Cap Icon -->
  <path d="M100 50 L155 78 L100 106 L45 78 Z" fill="#ffffff" />
  <path d="M65 92 L65 125 C65 140 100 148 100 148 C100 148 135 140 135 125 L135 92 L100 110 Z" fill="url(#grad2)" />
  <!-- Tassel -->
  <path d="M148 83 L152 120" stroke="#f72585" stroke-width="4" stroke-linecap="round" />
  <circle cx="152" cy="122" r="5" fill="#f72585" />
  
  <!-- Book pages at bottom -->
  <path d="M70 148 C85 142 100 145 100 148 C100 145 115 142 130 148 L130 156 C115 150 100 153 100 156 C100 153 85 150 70 156 Z" fill="#ffffff" opacity="0.9"/>
